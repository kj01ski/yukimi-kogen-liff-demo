<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆきみ高原 過ごし方提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@500;700&display=swap">
<style>
  :root{
    --bg:#EEF3F5;
    --page-text:#33454D;
    --surface:#FFFFFF;
    --surface-border:#D8E2E6;
    --text:#1C2B33;
    --text-muted:#5C7480;
    --accent:#1F6F8B;
    --accent-strong:#145A72;
    --accent-soft:#DCEEF3;
    --warm:#D97F2C;
    --warm-soft:#FBE6D2;
    --user-bubble:#1F6F8B;
    --user-bubble-text:#FFFFFF;
    --bot-bubble:#FFFFFF;
    --chip-bg:#FFFFFF;
    --chip-border:#BFD4DB;
    --chip-selected-bg:#1F6F8B;
    --chip-selected-text:#FFFFFF;
    --danger:#B4483B;
    --overlay:rgba(16,24,32,0.5);
    --shadow-sm:0 1px 2px rgba(28,43,51,0.07);
    --shadow-md:0 6px 20px rgba(28,43,51,0.12);
    --divider:#E3EAEC;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F171E;
      --page-text:#C9D7DC;
      --surface:#18232B;
      --surface-border:#28363F;
      --text:#E8F0F2;
      --text-muted:#93A9B2;
      --accent:#5FB2CC;
      --accent-strong:#83C6DB;
      --accent-soft:#1C333B;
      --warm:#E7A25B;
      --warm-soft:#3A2A18;
      --user-bubble:#2C7C93;
      --user-bubble-text:#F5FBFD;
      --bot-bubble:#18232B;
      --chip-bg:#18232B;
      --chip-border:#33454E;
      --chip-selected-bg:#5FB2CC;
      --chip-selected-text:#0F171E;
      --danger:#E2897B;
      --overlay:rgba(4,8,12,0.65);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
      --shadow-md:0 10px 28px rgba(0,0,0,0.5);
      --divider:#233039;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F171E;
    --page-text:#C9D7DC;
    --surface:#18232B;
    --surface-border:#28363F;
    --text:#E8F0F2;
    --text-muted:#93A9B2;
    --accent:#5FB2CC;
    --accent-strong:#83C6DB;
    --accent-soft:#1C333B;
    --warm:#E7A25B;
    --warm-soft:#3A2A18;
    --user-bubble:#2C7C93;
    --user-bubble-text:#F5FBFD;
    --bot-bubble:#18232B;
    --chip-bg:#18232B;
    --chip-border:#33454E;
    --chip-selected-bg:#5FB2CC;
    --chip-selected-text:#0F171E;
    --danger:#E2897B;
    --overlay:rgba(4,8,12,0.65);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 10px 28px rgba(0,0,0,0.5);
    --divider:#233039;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--page-text);
    font-family:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    margin:0;
    padding:0;
    min-height:100vh;
  }

  /* LIFF内はミニアプリ画面そのものがチャット画面。frame装飾は外側Web表示時のみ見せる */
  .frame{
    width:100%;
    max-width:100%;
    height:100vh;
    height:100dvh;
    background:var(--surface);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .talk-header{
    background:var(--accent);
    color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .talk-header .avatar{
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,0.2);
    display:flex;align-items:center;justify-content:center;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:900;font-size:15px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.35);
  }
  .talk-header .titles{flex:1;min-width:0;}
  .talk-header .titles .name{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;font-size:15px;line-height:1.3;
  }
  .talk-header .titles .sub{
    font-size:11px;opacity:.85;line-height:1.3;
  }
  .talk-header .reset-btn{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    font-family:"M PLUS Rounded 1c",sans-serif;
    font-size:11.5px;
    font-weight:700;
    padding:7px 10px;
    border-radius:10px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .talk-header .reset-btn:hover{background:rgba(255,255,255,0.28);}
  .talk-header .reset-btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  .thread{
    flex:1;
    overflow-y:auto;
    padding:16px 14px 10px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:
      radial-gradient(circle at 12% 8%, var(--accent-soft) 0%, transparent 45%),
      var(--bg);
  }
  .row{display:flex;gap:8px;max-width:100%;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}
  .bot-avatar{
    width:26px;height:26px;border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:900;font-size:11px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-top:2px;
  }
  .bubble{
    font-size:14px;
    line-height:1.65;
    padding:10px 13px;
    border-radius:16px;
    max-width:78%;
    white-space:pre-wrap;
    box-shadow:var(--shadow-sm);
  }
  .bubble.bot{
    background:var(--bot-bubble);
    border:1px solid var(--surface-border);
    color:var(--text);
    border-top-left-radius:4px;
  }
  .bubble.user{
    background:var(--user-bubble);
    color:var(--user-bubble-text);
    border-top-right-radius:4px;
  }
  .bubble.system{
    background:var(--accent-soft);
    color:var(--accent-strong);
    border:1px solid transparent;
    font-size:13px;
    border-top-left-radius:4px;
  }

  .plancard{
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:16px;
    padding:12px;
    max-width:86%;
    box-shadow:var(--shadow-sm);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .plancard .badge{
    align-self:flex-start;
    font-family:"M PLUS Rounded 1c",sans-serif;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--warm);
    background:var(--warm-soft);
    padding:3px 9px;
    border-radius:999px;
  }
  .plancard .badge.alt{color:var(--accent-strong);background:var(--accent-soft);}
  .plancard .pname{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--text);
    line-height:1.4;
  }
  .plancard .ptag{font-size:12px;color:var(--text-muted);}
  .plancard .pmeta{
    display:flex;gap:12px;font-size:12.5px;color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    border-top:1px dashed var(--divider);
    padding-top:7px;
  }
  .plancard .preason{
    font-size:12.5px;color:var(--text-muted);line-height:1.55;
  }
  .plancard .pbtn{
    margin-top:2px;
    background:var(--accent);
    color:#fff;
    border:none;
    font-family:"M PLUS Rounded 1c",sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 10px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .plancard .pbtn:hover{background:var(--accent-strong);}
  .plancard .pbtn:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;}

  .composer{
    flex-shrink:0;
    border-top:1px solid var(--surface-border);
    background:var(--surface);
    padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .composer .q-label{
    font-size:12px;
    color:var(--text-muted);
    font-weight:500;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-family:"M PLUS Rounded 1c",sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 13px;
    border-radius:999px;
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--text);
    cursor:pointer;
    transition:all .12s ease;
    line-height:1.3;
  }
  .chip:hover{border-color:var(--accent);}
  .chip:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;}
  .chip.selected{
    background:var(--chip-selected-bg);
    border-color:var(--chip-selected-bg);
    color:var(--chip-selected-text);
  }
  .chip.wide{width:100%;text-align:center;font-weight:700;}
  .chip.ghost{background:transparent;}
  .chip.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .chip.primary:hover{background:var(--accent-strong);}
  .chip.primary[disabled]{
    opacity:.4;cursor:not-allowed;
  }
  .chip.primary[disabled]:hover{background:var(--accent);}

  .sheet-overlay{
    position:absolute;inset:0;
    background:var(--overlay);
    display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;
    transition:opacity .18s ease;
    z-index:5;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    background:var(--surface);
    width:100%;
    max-height:88%;
    border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;
    transform:translateY(12px);
    transition:transform .18s ease;
    box-shadow:var(--shadow-md);
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-head{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--divider);
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    flex-shrink:0;
  }
  .sheet-head .htitle{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:700;font-size:16px;color:var(--text);line-height:1.4;
  }
  .sheet-head .htag{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .sheet-close{
    background:var(--accent-soft);
    border:none;color:var(--accent-strong);
    width:28px;height:28px;border-radius:50%;
    font-size:15px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .sheet-close:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;}
  .sheet-body{
    overflow-y:auto;padding:14px 16px 8px;
    display:flex;flex-direction:column;gap:16px;
  }
  .sec-title{
    font-family:"M PLUS Rounded 1c",sans-serif;
    font-weight:700;font-size:12.5px;
    letter-spacing:.03em;
    color:var(--accent-strong);
    display:flex;align-items:center;gap:6px;
  }
  .steps{display:flex;flex-direction:column;}
  .step{
    display:flex;gap:10px;
    padding:9px 0;
    border-bottom:1px dashed var(--divider);
  }
  .step:last-child{border-bottom:none;}
  .step .stepnum{
    width:20px;height:20px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent-strong);
    font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .step .sname{font-size:13.5px;font-weight:500;color:var(--text);}
  .step .smeta{font-size:12px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .movehint{font-size:11.5px;color:var(--text-muted);padding-left:30px;margin-top:-4px;}

  .costline{
    display:flex;justify-content:space-between;gap:10px;
    font-size:13px;padding:6px 0;border-bottom:1px dashed var(--divider);
  }
  .costline:last-of-type{border-bottom:none;}
  .costline .cname{color:var(--text);}
  .costline .cunit{color:var(--text-muted);font-size:11.5px;}
  .costline .camt{font-weight:700;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .costtotal{
    display:flex;justify-content:space-between;
    background:var(--accent-soft);
    border-radius:10px;padding:9px 11px;
    font-size:13px;color:var(--accent-strong);font-weight:700;
    margin-top:4px;
  }
  .costnote{font-size:11.5px;color:var(--text-muted);line-height:1.6;}

  .conditem{padding:8px 0;border-bottom:1px dashed var(--divider);}
  .conditem:last-child{border-bottom:none;}
  .conditem .cname{font-size:13px;font-weight:500;color:var(--text);}
  .conditem .cbody{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.6;}

  .locitem{padding:8px 0;border-bottom:1px dashed var(--divider);display:flex;gap:8px;}
  .locitem:last-child{border-bottom:none;}
  .locitem .lname{font-size:13px;font-weight:500;color:var(--text);}
  .locitem .lplace{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .sheet-foot{
    flex-shrink:0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    border-top:1px solid var(--divider);
    display:flex;gap:8px;
  }
  .sheet-foot .chip{flex:1;text-align:center;}

  .disclaim{
    font-size:11px;color:var(--text-muted);
    text-align:center;line-height:1.6;
    padding:8px 14px;
    flex-shrink:0;
    display:none; /* LIFF内は非表示。外部ブラウザで開いた時だけJSで表示する */
  }

  ::-webkit-scrollbar{width:7px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-border);border-radius:6px;}
</style>
</head>
<body>

<div class="frame">
  <div class="talk-header">
    <div class="avatar">雪</div>
    <div class="titles">
      <div class="name">ゆきみ高原スキー場</div>
      <div class="sub">公式アカウント（デモ）</div>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">はじめから</button>
  </div>
  <div class="thread" id="thread"></div>
  <div class="composer" id="composer"></div>
  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="htitle" id="sheetTitle"></div>
          <div class="htag" id="sheetTag"></div>
        </div>
        <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">&#10005;</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot"></div>
    </div>
  </div>
</div>
<p class="disclaim" id="disclaim">※本プロトタイプは架空施設「ゆきみ高原スキー場」のデモです。実際の予約・決済・在庫確保は発生しません。</p>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  /* LINEアプリ外（PCブラウザ等）でLIFFが使えない場合だけ、下部に注意書きを表示する */
  (function(){
    function showDisclaimIfOutsideLiff(){
      if (!window.__liffReady) document.getElementById("disclaim").style.display = "block";
    }
    window.addEventListener("load", function(){ setTimeout(showDisclaimIfOutsideLiff, 300); });
  })();
</script>
</body>
</html>
